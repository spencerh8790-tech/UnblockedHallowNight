  <!-- ============================================== -->
  <!-- GAME ENGINE & INDEXEDDB SCRIPT                 -->
  <!-- ============================================== -->
  <script>
    // --- FULLSCREEN HANDLER ---
    function toggleFullscreen() {
      const elem = document.getElementById('game-frame-wrapper');
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // --- INDEXEDDB CACHE SYSTEM ---
    const DB_NAME = "cachedb";
    const STORE_NAME = "files";

    function openCacheDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveToCache(key, blob) {
      try {
        const db = await openCacheDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put(blob, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        console.warn("IndexedDB cache save skipped:", e);
      }
    }

    async function loadFromCache(key) {
      try {
        const db = await openCacheDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return null;
      }
    }

    // --- DOWNLOAD MERGER ---
    const CDN_BASE = "https://cdn.jsdelivr.net/gh/aukak/hollow-knight@2fc2e7149f0d5b2609b135ab48f00fd973930635/";
    const statusText = document.getElementById("loader-status");
    const progressFill = document.getElementById("progress-bar-fill");
    let loadedBytes = 0;
    const TOTAL_BYTES_APPROX = 912.81 * 1024 * 1024;

    async function fetchWithProgress(relativeUrl) {
      const fullUrl = CDN_BASE + relativeUrl;
      const response = await fetch(fullUrl);
      if (!response.ok) throw new Error(`HTTP ${response.status} fetching ${relativeUrl}`);
      
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        
        const mbDone = (loadedBytes / (1024 * 1024)).toFixed(1);
        const percent = Math.min(99, ((loadedBytes / TOTAL_BYTES_APPROX) * 100)).toFixed(0);
        
        statusText.textContent = `DOWNLOADING GAME ASSETS: ${mbDone} MB / 912.8 MB (${percent}%)`;
        progressFill.style.width = `${percent}%`;
      }

      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cached = await loadFromCache(cacheKey);
      if (cached) {
        statusText.textContent = `LOADED ${cacheKey} FROM LOCAL CACHE! ⚡`;
        return URL.createObjectURL(cached);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      await saveToCache(cacheKey, mergedBlob);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }

    // --- GAME BOOTSTRAP ---
    (async () => {
      try {
        statusText.textContent = "CHECKING LOCAL CACHE & CDN...";
        
        const [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(getParts("Build/hktruffled.data", 1, 45), "hktruffled.data"),
          mergeFiles(getParts("Build/hktruffled.wasm", 1, 2), "hktruffled.wasm"),
        ]);

        statusText.textContent = "COMPILING WEBASSEMBLY ENGINE...";
        progressFill.style.width = "99%";

        const canvas = document.getElementById("unity-canvas");
        const loaderUrl = CDN_BASE + "Build/hktruffled.loader.js";

        const config = {
          dataUrl: dataUrl,
          frameworkUrl: CDN_BASE + "Build/hktruffled.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: CDN_BASE + "StreamingAssets",
          companyName: "Team Cherry & Truffled",
          productName: "Hollow Knight",
          productVersion: "1.1",
        };

        function resizeCanvas() {
          const wrapper = document.getElementById("game-frame-wrapper");
          canvas.width = wrapper.clientWidth;
          canvas.height = wrapper.clientHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        canvas.addEventListener("click", () => canvas.focus());

        // Load Unity Loader Script
        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          statusText.textContent = "INITIALIZING HOLLOW KNIGHT UNITY INSTANCE...";
          createUnityInstance(canvas, config, (progress) => {
            progressFill.style.width = `${Math.round(progress * 100)}%`;
            statusText.textContent = `STARTING UNITY ENGINE: ${Math.round(progress * 100)}%`;
          }).then((unityInstance) => {
            const loaderOverlay = document.getElementById("game-loader-overlay");
            loaderOverlay.style.transition = "opacity 0.5s ease";
            loaderOverlay.style.opacity = "0";
            setTimeout(() => {
              loaderOverlay.style.display = "none";
              canvas.focus();
            }, 500);
          }).catch(async (err) => {
            console.error("Unity Instance Error:", err);
            statusText.textContent = "Failed to launch game: " + err;
            alert("Error loading Unity WebGL: " + err);
          });
        };
        document.body.appendChild(script);

      } catch (err) {
        console.error("Bootstrap Error:", err);
        statusText.textContent = "Error loading assets: " + err.message;
        alert("Download error: " + err.message);
      }
    })();
  </script>
